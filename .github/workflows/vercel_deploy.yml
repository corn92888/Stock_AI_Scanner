name: Deploy Control Center

on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - "web/**"
    - "!web/public/dashboard_snapshot.json"
    - ".github/workflows/vercel_deploy.yml"

permissions:
  contents: read

concurrency:
  group: stock-ai-control-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: web

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Pull production environment
      run: npx vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

    - name: Build production deployment
      run: npx vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

    - name: Deploy production output
      run: npx vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
