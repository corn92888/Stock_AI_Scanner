name: Institutional Flow Intelligence
run-name: Institutional flow refresh (${{ inputs.trigger_source || 'workflow-dispatch' }})

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Trigger source for audit logs
        required: false
        default: github
        type: string
      refresh:
        description: Re-fetch dates already present in the audit ledger
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: stock-scanner-automation
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUD_EVIDENCE_MODE: ${{ vars.CLOUD_EVIDENCE_MODE || 'dual_write' }}
      CLOUD_EVIDENCE_REQUIRED: ${{ vars.CLOUD_EVIDENCE_REQUIRED || 'false' }}
      EVIDENCE_WORKFLOW: institutional_flow

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Synchronize latest research database
      run: git pull --ff-only origin main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: requirements-market.txt

    - name: Restore newer verified cloud evidence
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: bash restore_scanner_data.sh

    - name: Install collection dependencies
      run: pip install --prefer-binary -r requirements-market.txt

    - name: Collect official institutional trading flow
      env:
        REFRESH: ${{ inputs.refresh }}
      run: |
        args=(
          --as-of "$(TZ=Asia/Taipei date +%F)"
          --lookback-calendar-days 45
          --retention-days 60
          --feature-scope latest-trade-date
          --fail-on-error
        )
        if [ "$REFRESH" = "true" ]; then
          args+=(--refresh)
        fi
        python institutional_flow.py "${args[@]}"

    - name: Export dashboard snapshot
      run: python export_dashboard_snapshot.py

    - name: Persist institutional evidence
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        bash persist_scanner_data.sh "chore(data): refresh institutional flow evidence"

    - name: Upload institutional flow evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: institutional-flow-evidence
        path: |
          data/stock_scanner.db
          data/dashboard_snapshot.json
        retention-days: 7
        if-no-files-found: error

    - name: Send collection failure alert
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl --fail --silent --show-error --retry 2 --max-time 20 \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=法人籌碼自動收集失敗｜run=${{ github.run_id }}｜請查看 GitHub Actions" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
        fi
