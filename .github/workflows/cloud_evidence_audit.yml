name: Cloud Evidence Cutover Audit
run-name: Cloud-primary cutover audit

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Trigger source for audit logs
        required: false
        default: manual
        type: string
      require_ready:
        description: Fail the final gate when cloud-primary requirements are not met
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: stock-scanner-automation
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUD_EVIDENCE_MODE: ${{ vars.CLOUD_EVIDENCE_MODE || 'dual_write' }}
      CLOUD_EVIDENCE_REQUIRED: ${{ vars.CLOUD_EVIDENCE_REQUIRED || 'false' }}
      EVIDENCE_WORKFLOW: cloud_evidence_audit
      AUDIT_TRIGGER_SOURCE: ${{ inputs.trigger_source || 'manual' }}

    steps:
    - name: Checkout latest repository
      uses: actions/checkout@v4

    - name: Synchronize latest research database
      run: git pull --ff-only origin main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: requirements-intraday.txt

    - name: Restore newer verified cloud evidence
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: bash restore_scanner_data.sh

    - name: Install dashboard dependencies
      run: pip install --prefer-binary -r requirements-intraday.txt

    - name: Run cutover audit and restore drill
      id: audit
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        python cloud_evidence.py audit \
          --database data/stock_scanner.db \
          --output "$RUNNER_TEMP/cloud_evidence_audit.json" \
          --github-output "$GITHUB_OUTPUT"

    - name: Upload cutover audit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cloud-evidence-cutover-audit
        path: ${{ runner.temp }}/cloud_evidence_audit.json
        retention-days: 30
        if-no-files-found: error

    - name: Persist cutover audit and dashboard
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        bash persist_scanner_data.sh "chore(data): record cloud cutover audit"

    - name: Write cutover summary
      if: always()
      run: |
        echo "### Cloud-primary cutover audit" >> "$GITHUB_STEP_SUMMARY"
        echo "- Status: ${{ steps.audit.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
        echo "- Ready: ${{ steps.audit.outputs.ready }}" >> "$GITHUB_STEP_SUMMARY"
        echo "- Checks: ${{ steps.audit.outputs.passed_checks }}/${{ steps.audit.outputs.total_checks }}" >> "$GITHUB_STEP_SUMMARY"
        echo "- Trigger: $AUDIT_TRIGGER_SOURCE" >> "$GITHUB_STEP_SUMMARY"

    - name: Enforce requested readiness gate
      if: ${{ inputs.require_ready && steps.audit.outputs.ready != 'true' }}
      run: |
        echo "Cloud-primary cutover requirements are not satisfied." >&2
        exit 1
