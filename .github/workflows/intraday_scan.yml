name: Intraday Stock AI Scanner

on:
  schedule:
    # Offset seven minutes from common queue peaks while preserving each
    # Asia/Taipei 09:00-13:30 half-hour decision slot in automation_guard.py.
    # Separate expressions let the guard retain the intended slot even when
    # GitHub queues a scheduled run several minutes late.
    - cron: '7 1 * * 1-5'   # 09:07 -> 09:00 slot
    - cron: '37 1 * * 1-5'  # 09:37 -> 09:30 slot
    - cron: '7 2 * * 1-5'   # 10:07 -> 10:00 slot
    - cron: '37 2 * * 1-5'  # 10:37 -> 10:30 slot
    - cron: '7 3 * * 1-5'   # 11:07 -> 11:00 slot
    - cron: '37 3 * * 1-5'  # 11:37 -> 11:30 slot
    - cron: '7 4 * * 1-5'   # 12:07 -> 12:00 slot
    - cron: '37 4 * * 1-5'  # 12:37 -> 12:30 slot
    - cron: '7 5 * * 1-5'   # 13:07 -> 13:00 slot
    - cron: '37 5 * * 1-5'  # 13:37 -> 13:30 slot
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Trigger source for audit logs
        required: false
        default: github
        type: string

permissions:
  contents: write

concurrency:
  group: stock-scanner-automation
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: requirements-intraday.txt

    - name: Decide whether this automation slot should run
      id: gate
      env:
        EVENT_NAME: ${{ github.event_name }}
        EVENT_SCHEDULE: ${{ github.event.schedule }}
      run: |
        args=()
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          args+=(--ignore-existing)
        elif [ -n "$EVENT_SCHEDULE" ]; then
          args+=(--scheduled-cron "$EVENT_SCHEDULE")
        fi
        python automation_guard.py --github-output "$GITHUB_OUTPUT" "${args[@]}"

    - name: Install dependencies
      if: steps.gate.outputs.run == 'true'
      run: |
        pip install --prefer-binary -r requirements-intraday.txt

    - name: Run intraday analysis report
      if: steps.gate.outputs.run == 'true'
      env:
        # 將設定在 GitHub 上的秘密金鑰載入環境變數
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        INTRADAY_AUTOMATION_SLOT: ${{ steps.gate.outputs.slot }}
      run: |
        python intraday_analysis_report.py --run-scanner --run-market-monitor --run-ai --send-telegram --send-raw-scanner-telegram

    - name: Export dashboard snapshot
      if: steps.gate.outputs.run == 'true'
      run: |
        python export_dashboard_snapshot.py

    - name: Persist signal database
      if: always() && steps.gate.outputs.run == 'true'
      run: |
        bash persist_scanner_data.sh "chore(data): record intraday scanner signals"

    - name: Upload Excel Reports
      if: always() && steps.gate.outputs.run == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: intraday-stock-reports
        path: |
          Reports/盤中日報_*.xlsx
          Reports/市場監控_*.xlsx
          Reports/盤中分析報告_*.txt
          Reports/盤中候選交叉排名_*.csv
          data/stock_scanner.db
          data/dashboard_snapshot.json
        retention-days: 5
        if-no-files-found: ignore

    - name: Send automation failure alert
      if: failure() && steps.gate.outputs.run == 'true'
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl --fail --silent --show-error --retry 2 --max-time 20 \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=盤中自動化失敗｜slot=${{ steps.gate.outputs.slot }}｜run=${{ github.run_id }}｜請查看 GitHub Actions" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
        fi

    - name: Write automation summary
      if: always()
      run: |
        echo "### Intraday automation decision" >> "$GITHUB_STEP_SUMMARY"
        echo "- Taipei time: ${{ steps.gate.outputs.now }}" >> "$GITHUB_STEP_SUMMARY"
        echo "- Slot: ${{ steps.gate.outputs.slot }}" >> "$GITHUB_STEP_SUMMARY"
        echo "- Run: ${{ steps.gate.outputs.run }}" >> "$GITHUB_STEP_SUMMARY"
        echo "- Reason: ${{ steps.gate.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
