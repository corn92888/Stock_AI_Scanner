name: Intraday Stock AI Scanner

on:
  schedule:
    # 台灣時間 10:00 (UTC 2), 11:30 (UTC 3:30), 13:00 (UTC 5) 盤中狙擊
    - cron: '0 2,5 * * 1-5'
    - cron: '30 3 * * 1-5'
  workflow_dispatch: # 保留一個按鈕讓你可以隨時手動點擊觸發

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy twstock tqdm requests python-dotenv streamlit plotly openpyxl

    - name: Run intraday scanner
      env:
        # 將設定在 GitHub 上的秘密金鑰載入環境變數
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python intraday_scanner.py

    - name: Upload Excel Reports
      uses: actions/upload-artifact@v4
      with:
        name: intraday-stock-reports
        path: Reports/盤中日報_*.xlsx
        retention-days: 5
        if-no-files-found: ignore
