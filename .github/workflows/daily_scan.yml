name: Daily Stock AI Scanner

on:
  schedule:
    # 這裡設定每週一到週五的 UTC 6:00 (台灣 14:00) 執行，此時收盤，yfinance 更新完成。
    - cron: '0 6 * * 1-5'
  workflow_dispatch: # 保留一個按鈕讓你可以隨時手動點擊觸發

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy twstock tqdm requests python-dotenv streamlit plotly openpyxl

    - name: Run scanner
      env:
        # 將設定在 GitHub 上的秘密金鑰載入環境變數給 scanner.py 使用
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python scanner.py

    - name: Persist signal database
      run: |
        if [ -f data/stock_scanner.db ]; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock_scanner.db
          if ! git diff --cached --quiet; then
            git commit -m "Record daily scanner signals"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No database changes to commit."
          fi
        else
          echo "No signal database found."
        fi

    - name: Upload Excel Reports
      # 將產出的 Excel 報表上傳打包，讓您可以直接從 GitHub 下載
      uses: actions/upload-artifact@v4
      with:
        name: daily-stock-reports
        path: |
          Reports/*.xlsx
          data/stock_scanner.db
        retention-days: 5
        if-no-files-found: ignore
