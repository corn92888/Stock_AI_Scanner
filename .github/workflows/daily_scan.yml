name: Daily Stock AI Scanner

on:
  schedule:
    # 這裡設定每週一到週五的 UTC 6:00 (台灣 14:00) 執行，此時收盤，yfinance 更新完成。
    - cron: '0 6 * * 1-5'
  workflow_dispatch: # 保留一個按鈕讓你可以隨時手動點擊觸發

permissions:
  contents: write

concurrency:
  group: stock-scanner-automation
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy twstock tqdm requests python-dotenv streamlit plotly openpyxl

    - name: Run scanner
      env:
        # 將設定在 GitHub 上的秘密金鑰載入環境變數給 scanner.py 使用
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python scanner.py

    - name: Update matured backtest outcomes
      continue-on-error: true
      run: |
        python backtest.py --limit 200

    - name: Export dashboard snapshot
      run: |
        python export_dashboard_snapshot.py

    - name: Persist signal database
      if: always()
      run: |
        if [ -f data/stock_scanner.db ]; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stock_scanner.db data/dashboard_snapshot.json web/public/dashboard_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Record daily scanner signals"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No database changes to commit."
          fi
        else
          echo "No signal database found."
        fi

    - name: Upload Excel Reports
      if: always()
      # 將產出的 Excel 報表上傳打包，讓您可以直接從 GitHub 下載
      uses: actions/upload-artifact@v4
      with:
        name: daily-stock-reports
        path: |
          Reports/*.xlsx
          data/stock_scanner.db
          data/dashboard_snapshot.json
        retention-days: 5
        if-no-files-found: ignore

    - name: Send automation failure alert
      if: failure()
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl --fail --silent --show-error --retry 2 --max-time 20 \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=盤後自動化失敗｜run=${{ github.run_id }}｜請查看 GitHub Actions" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
        fi
