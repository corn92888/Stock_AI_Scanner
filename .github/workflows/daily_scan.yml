name: Daily Stock AI Scanner
run-name: Daily scan (${{ inputs.trigger_source || 'workflow-dispatch' }})

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Trigger source for audit logs
        required: false
        default: github
        type: string

permissions:
  contents: write

concurrency:
  group: stock-scanner-automation
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUD_EVIDENCE_MODE: ${{ vars.CLOUD_EVIDENCE_MODE || 'dual_write' }}
      CLOUD_EVIDENCE_REQUIRED: ${{ vars.CLOUD_EVIDENCE_REQUIRED || 'false' }}
      CLOUD_EVIDENCE_RETENTION_DAYS: ${{ vars.CLOUD_EVIDENCE_RETENTION_DAYS || '45' }}
      CLOUD_EVIDENCE_ARCHIVE: "true"
      FORMAL_RECOMMENDATIONS_APPROVED: ${{ vars.FORMAL_RECOMMENDATIONS_APPROVED || 'false' }}
      EVIDENCE_WORKFLOW: daily_scan

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Synchronize latest research database
      run: |
        git pull --ff-only origin main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Restore newer verified cloud evidence
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: bash restore_scanner_data.sh

    - name: Decide whether daily automation should run
      id: gate
      env:
        EVENT_NAME: ${{ github.event_name }}
        TRIGGER_SOURCE: ${{ inputs.trigger_source }}
      run: |
        args=(--mode eod)
        if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$TRIGGER_SOURCE" != "vercel-cron" ]; then
          args+=(--ignore-existing)
        fi
        python automation_guard.py --github-output "$GITHUB_OUTPUT" "${args[@]}"

    - name: Install dependencies
      if: steps.gate.outputs.run == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Restore governed Alpha v2 model
      if: steps.gate.outputs.run == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p data/models
        gh release download research-alpha-data-v2 \
          --pattern 'alpha_strategy_v2_model.joblib' \
          --dir data/models \
          --clobber

    - name: Run scanner
      if: steps.gate.outputs.run == 'true'
      env:
        # 將設定在 GitHub 上的秘密金鑰載入環境變數給 scanner.py 使用
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python scanner.py

    - name: Update formal selection outcomes
      if: steps.gate.outputs.run == 'true'
      continue-on-error: true
      run: |
        python backtest.py --selection-scope formal --limit 200

    - name: Drain overdue prospective outcome queue
      if: steps.gate.outputs.run == 'true'
      continue-on-error: true
      run: |
        python outcome_maturation.py --batch-size 500 --max-batches 4 --fail-on-stale

    - name: Mature prospective multi-horizon execution scenarios
      if: steps.gate.outputs.run == 'true'
      continue-on-error: true
      run: |
        python candidate_execution_research.py --limit 1000

    - name: Backfill non-formal research outcomes
      if: steps.gate.outputs.run == 'true'
      continue-on-error: true
      run: |
        python backtest.py --selection-scope nonformal --limit 200

    - name: Update AI shadow model outcomes
      if: steps.gate.outputs.run == 'true'
      continue-on-error: true
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      run: |
        python ai_pipeline.py --no-news

    - name: Evaluate strategy experiments
      if: steps.gate.outputs.run == 'true'
      run: |
        python research_evaluation.py

    - name: Govern walk-forward strategy challengers
      if: steps.gate.outputs.run == 'true'
      run: |
        python strategy_challenger.py

    - name: Settle paper accounts and prospective capital tournament
      if: steps.gate.outputs.run == 'true'
      run: |
        python paper_trading.py

    - name: Refresh global market context
      if: steps.gate.outputs.run == 'true'
      continue-on-error: true
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        python global_market.py

    - name: Audit research data maturity
      if: steps.gate.outputs.run == 'true'
      run: |
        python research_monitor.py

    - name: Evaluate prospective Alpha governance
      if: steps.gate.outputs.run == 'true'
      run: |
        python alpha_forward_monitor.py

    - name: Export dashboard snapshot
      if: steps.gate.outputs.run == 'true'
      run: |
        python export_dashboard_snapshot.py

    - name: Persist signal database
      if: always() && steps.gate.outputs.run == 'true'
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        bash persist_scanner_data.sh "chore(data): record daily scanner signals"

    - name: Upload Excel Reports
      if: always() && steps.gate.outputs.run == 'true'
      # 將產出的 Excel 報表上傳打包，讓您可以直接從 GitHub 下載
      uses: actions/upload-artifact@v4
      with:
        name: daily-stock-reports
        path: |
          Reports/*.xlsx
          data/stock_scanner.db
          data/dashboard_snapshot.json
          data/global_market_latest.json
        retention-days: 5
        if-no-files-found: ignore

    - name: Send automation failure alert
      if: failure() && steps.gate.outputs.run == 'true'
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl --fail --silent --show-error --retry 2 --max-time 20 \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=盤後自動化失敗｜run=${{ github.run_id }}｜請查看 GitHub Actions" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
        fi

    - name: Write automation summary
      if: always()
      run: |
        echo "### Daily automation decision" >> "$GITHUB_STEP_SUMMARY"
        echo "- Taipei time: ${{ steps.gate.outputs.now }}" >> "$GITHUB_STEP_SUMMARY"
        echo "- Run: ${{ steps.gate.outputs.run }}" >> "$GITHUB_STEP_SUMMARY"
        echo "- Reason: ${{ steps.gate.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
