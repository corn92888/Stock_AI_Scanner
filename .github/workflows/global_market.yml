name: Global Market Intelligence
run-name: Global market refresh (${{ inputs.trigger_source || 'workflow-dispatch' }})

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Trigger source for audit logs
        required: false
        default: github
        type: string

permissions:
  contents: write

concurrency:
  group: stock-scanner-automation
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUD_EVIDENCE_MODE: ${{ vars.CLOUD_EVIDENCE_MODE || 'dual_write' }}
      CLOUD_EVIDENCE_REQUIRED: ${{ vars.CLOUD_EVIDENCE_REQUIRED || 'false' }}
      EVIDENCE_WORKFLOW: global_market

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Synchronize latest research database
      run: |
        git pull --ff-only origin main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: requirements-market.txt

    - name: Restore newer verified cloud evidence
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: bash restore_scanner_data.sh

    - name: Install market data dependencies
      run: |
        pip install --prefer-binary -r requirements-market.txt

    - name: Collect normalized global market context
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        python global_market.py

    - name: Export dashboard snapshot
      run: |
        python export_dashboard_snapshot.py

    - name: Persist market database
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        bash persist_scanner_data.sh "chore(data): refresh global market snapshot"

    - name: Upload market snapshot
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: global-market-snapshot
        path: |
          data/global_market_latest.json
          data/dashboard_snapshot.json
        retention-days: 5
        if-no-files-found: ignore
