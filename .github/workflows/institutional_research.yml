name: Generation 2 Institutional Research
run-name: Generation 2 institutional ablation

on:
  workflow_dispatch:
  workflow_run:
    workflows:
    - Historical Institutional Flow Archive
    types:
    - completed

permissions:
  contents: write

jobs:
  evaluate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUD_EVIDENCE_MODE: ${{ vars.CLOUD_EVIDENCE_MODE || 'dual_write' }}
      CLOUD_EVIDENCE_REQUIRED: ${{ vars.CLOUD_EVIDENCE_REQUIRED || 'false' }}
      EVIDENCE_WORKFLOW: institutional_research
    concurrency:
      group: stock-scanner-automation
      cancel-in-progress: false

    steps:
    - name: Checkout latest repository
      uses: actions/checkout@v4

    - name: Synchronize latest research database
      run: git pull --ff-only origin main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Restore newer verified cloud evidence
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: bash restore_scanner_data.sh

    - name: Install research dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-intraday.txt

    - name: Restore complete annual institutional shards
      id: shards
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "$RUNNER_TEMP/institutional"
        ready=true
        for year in $(seq 2020 2025); do
          asset="institutional-flow-${year}.db.gz"
          if gh release download research-institutional-data-v1 \
            --pattern "$asset" \
            --dir "$RUNNER_TEMP/institutional" \
            --clobber; then
            gzip -dc "$RUNNER_TEMP/institutional/$asset" \
              > "$RUNNER_TEMP/institutional/institutional-flow-${year}.db"
          else
            echo "Missing $asset; research will wait for the archive workflow."
            ready=false
          fi
        done
        echo "ready=$ready" >> "$GITHUB_OUTPUT"

    - name: Build point-in-time institutional replay dataset
      if: steps.shards.outputs.ready == 'true'
      run: |
        args=(
          --base data/replay_training_samples.csv.gz
          --output "$RUNNER_TEMP/replay_training_samples_institutional.csv.gz"
        )
        for shard in "$RUNNER_TEMP"/institutional/*.db; do
          args+=(--shard "$shard")
        done
        python institutional_replay_dataset.py "${args[@]}"

    - name: Run locked development and validation ablations
      if: steps.shards.outputs.ready == 'true'
      run: |
        python institutional_research.py \
          --dataset "$RUNNER_TEMP/replay_training_samples_institutional.csv.gz" \
          --db data/stock_scanner.db

    - name: Build development-only institutional attribution
      if: steps.shards.outputs.ready == 'true'
      run: |
        python institutional_attribution.py \
          --dataset "$RUNNER_TEMP/replay_training_samples_institutional.csv.gz" \
          --output "$RUNNER_TEMP/institutional_attribution.json"

    - name: Run pre-registered conditional interaction ablations
      if: steps.shards.outputs.ready == 'true'
      run: |
        python institutional_conditional_research.py \
          --dataset "$RUNNER_TEMP/replay_training_samples_institutional.csv.gz" \
          --attribution "$RUNNER_TEMP/institutional_attribution.json" \
          --db data/stock_scanner.db

    - name: Publish governed enriched dataset
      if: steps.shards.outputs.ready == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload research-institutional-data-v1 \
          "$RUNNER_TEMP/replay_training_samples_institutional.csv.gz" \
          "$RUNNER_TEMP/replay_training_samples_institutional.csv.gz.metadata.json" \
          "$RUNNER_TEMP/institutional_attribution.json" \
          --clobber

    - name: Persist research evidence and dashboard
      if: steps.shards.outputs.ready == 'true'
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: 'bash persist_scanner_data.sh "chore(data): record institutional interaction evidence"'
