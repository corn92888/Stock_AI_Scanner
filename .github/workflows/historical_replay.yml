name: Historical Point-in-Time Replay
run-name: Historical replay (${{ inputs.start_date }} to ${{ inputs.end_date }})

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First historical decision date (YYYY-MM-DD)
        required: true
        type: string
      end_date:
        description: Last historical decision date (YYYY-MM-DD)
        required: true
        type: string
      codes:
        description: Optional comma-separated stock codes
        required: false
        default: ""
        type: string
      max_symbols:
        description: Optional deterministic universe cap; 0 scans all stocks
        required: false
        default: "0"
        type: string
      universe_file:
        description: Optional custom point-in-time CSV; blank rebuilds the official universe
        required: false
        default: ""
        type: string
      force_rebuild:
        description: Delete and rebuild an existing replay with the same versioned key
        required: false
        default: false
        type: boolean
      refresh_cache:
        description: Ignore cached Yahoo history and download the requested range again
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: stock-scanner-historical-replay
      cancel-in-progress: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Synchronize latest research database
      run: git pull --ff-only origin main

    - name: Prepare isolated replay database
      run: cp data/stock_scanner.db "$RUNNER_TEMP/historical_replay.db"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-intraday.txt

    - name: Restore historical price cache
      uses: actions/cache@v4
      with:
        path: data/replay_cache/yahoo
        key: replay-yahoo-${{ runner.os }}-${{ inputs.start_date }}-${{ inputs.end_date }}
        restore-keys: |
          replay-yahoo-${{ runner.os }}-

    - name: Build official point-in-time universe
      env:
        START_DATE: ${{ inputs.start_date }}
        END_DATE: ${{ inputs.end_date }}
        UNIVERSE_FILE: ${{ inputs.universe_file }}
      run: |
        if [ -z "$UNIVERSE_FILE" ]; then
          python historical_universe.py \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --output data/universe_history.csv
        fi

    - name: Run isolated historical replay
      env:
        START_DATE: ${{ inputs.start_date }}
        END_DATE: ${{ inputs.end_date }}
        CODES: ${{ inputs.codes }}
        MAX_SYMBOLS: ${{ inputs.max_symbols }}
        UNIVERSE_FILE: ${{ inputs.universe_file }}
        FORCE_REBUILD: ${{ inputs.force_rebuild }}
        REFRESH_CACHE: ${{ inputs.refresh_cache }}
        REPLAY_DB: ${{ runner.temp }}/historical_replay.db
      run: |
        args=(--start "$START_DATE" --end "$END_DATE" --db-path "$REPLAY_DB")
        if [ "$FORCE_REBUILD" = "true" ]; then
          args+=(--replace)
        else
          args+=(--resume)
        fi
        if [ "$REFRESH_CACHE" = "true" ]; then
          args+=(--refresh-cache)
        fi
        if [ -n "$CODES" ]; then
          args+=(--codes "$CODES")
        fi
        if [ "${MAX_SYMBOLS:-0}" -gt 0 ]; then
          args+=(--max-symbols "$MAX_SYMBOLS")
        fi
        if [ -n "$UNIVERSE_FILE" ]; then
          args+=(--universe-file "$UNIVERSE_FILE")
        else
          args+=(--universe-file data/universe_history.csv)
        fi
        python historical_replay.py "${args[@]}"

    - name: Generate replay factor attribution
      env:
        REPLAY_DB: ${{ runner.temp }}/historical_replay.db
      run: python replay_attribution.py --db-path "$REPLAY_DB"

    - name: Export compact replay training dataset
      env:
        REPLAY_DB: ${{ runner.temp }}/historical_replay.db
        REPLAY_DATASET: ${{ runner.temp }}/replay_training_samples.csv.gz
      run: |
        python replay_training_dataset.py \
          --database "$REPLAY_DB" \
          --output "$REPLAY_DATASET"

    - name: Train replay-informed shadow challenger
      env:
        REPLAY_DB: ${{ runner.temp }}/historical_replay.db
        REPLAY_MODELS: ${{ runner.temp }}/replay-models
        REPLAY_DATASET: ${{ runner.temp }}/replay_training_samples.csv.gz
      run: |
        python ai_pipeline.py \
          --db "$REPLAY_DB" \
          --replay-dataset "$REPLAY_DATASET" \
          --artifact-dir "$REPLAY_MODELS" \
          --no-news \
          --no-backfill-features \
          --no-predict

    - name: Stage isolated replay artifact
      if: always()
      run: |
        mkdir -p replay_artifact
        cp "$RUNNER_TEMP/historical_replay.db" replay_artifact/historical_replay.db
        cp data/universe_history* replay_artifact/ 2>/dev/null || true
        cp "$RUNNER_TEMP"/replay_training_samples.csv.gz* replay_artifact/
        if [ -d "$RUNNER_TEMP/replay-models" ]; then
          cp -R "$RUNNER_TEMP/replay-models" replay_artifact/models
        fi

    - name: Upload isolated replay database
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: historical-replay-${{ inputs.start_date }}-${{ inputs.end_date }}
        path: replay_artifact
        retention-days: 30
        if-no-files-found: error

  persist:
    needs: replay
    if: ${{ always() && needs.replay.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: stock-scanner-automation
      cancel-in-progress: false

    steps:
    - name: Checkout latest repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install persistence dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-intraday.txt

    - name: Download isolated replay database
      uses: actions/download-artifact@v4
      with:
        name: historical-replay-${{ inputs.start_date }}-${{ inputs.end_date }}
        path: replay-artifact

    - name: Package durable replay archive
      run: |
        python archive_historical_replay.py \
          --database replay-artifact/historical_replay.db \
          --output replay-artifact/historical-replay-${{ inputs.start_date }}-${{ inputs.end_date }}.tar.gz \
          --start "${{ inputs.start_date }}" \
          --end "${{ inputs.end_date }}" \
          --universe replay-artifact/universe_history.csv \
          --universe replay-artifact/universe_history.metadata.json \
          --include replay-artifact/replay_training_samples.csv.gz \
          --include replay-artifact/replay_training_samples.csv.gz.metadata.json

    - name: Publish durable replay archive
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if ! gh release view research-replay-data-v1 >/dev/null 2>&1; then
          gh release create research-replay-data-v1 \
            --target main \
            --title "Historical replay research data" \
            --notes "Versioned raw replay evidence for model training and audit."
        fi
        gh release upload research-replay-data-v1 \
          replay-artifact/historical-replay-${{ inputs.start_date }}-${{ inputs.end_date }}.tar.gz \
          --clobber

    - name: Merge replay evidence into latest research database
      run: |
        if compgen -G 'replay-artifact/models/*.joblib' > /dev/null; then
          mkdir -p data/models
          cp replay-artifact/models/*.joblib data/models/
        fi
        cp replay-artifact/replay_training_samples.csv.gz data/
        cp replay-artifact/replay_training_samples.csv.gz.metadata.json data/
        python merge_historical_replay.py \
          --source replay-artifact/historical_replay.db \
          --target data/stock_scanner.db \
          --start "${{ inputs.start_date }}" \
          --end "${{ inputs.end_date }}"
        python research_monitor.py

    - name: Persist replay evidence and dashboard
      run: |
        bash persist_scanner_data.sh "chore(data): record historical replay evidence"
